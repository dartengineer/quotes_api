name: lectern
description: "Lectern - an offline-first ebook and document reader."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.6.0

  # State management & navigation
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^18.0.2

  # Persistence
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
